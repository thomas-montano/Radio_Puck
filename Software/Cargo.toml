[package]
name = "radio-puck"
version = "0.1.0"
edition = "2024"
authors = ["ThomasMontano"]
publish = false

[dependencies]
embassy-stm32 = { version = "0.6.0", features = ["defmt", "stm32f407vg", "time-driver-any"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }

[[bin]]
name = "radio-puck"
test = false
bench = false

[profile.release]
codegen-units = 1 # better optimizations
debug = true      # symbols are nice and they don't increase the size on Flash
lto = true        # better optimizations
